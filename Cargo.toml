# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
resolver = "2"
members = ["rust/crates/umts-types", "rust/crates/umts-runtime", "rust/crates/umts-radio", "rust/crates/umts-dsp", "rust/crates/umts-config", "rust/crates/umts-hnb", "rust/crates/umts-rrc-schema", "rust/crates/umts-rrc-codec", "rust/crates/umts-rrc", "rust/crates/umts-mac", "rust/crates/umts-rlc", "rust/crates/umts-iuh", "rust/crates/umts-sctp", "rust/crates/sctp-transport", "rust/crates/umts-core", "rust/crates/umts-security", "rust/crates/umts-user-plane", "rust/crates/umts-management"]

[workspace.package]
authors = ["Chris Moos"]
version = "0.1.2"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-or-later"
repository = "https://github.com/chrismoos/umts-hnb"
publish = false

[workspace.dependencies]
umts-types = { path = "rust/crates/umts-types" }
umts-config = { path = "rust/crates/umts-config" }
num-complex = "0.4"
rustfft = "=6.4.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = "0.1"
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
sdr-hal = { version = "0.1.3", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"

[profile.release]
debug = "line-tables-only"
