# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: '2'
      # Hosted runners can have different CPUs even with the same cache key.
      RUSTFLAGS: -C target-cpu=x86-64
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo=; [ "$(id -u)" -eq 0 ] || sudo=sudo
          $sudo apt-get update
          $sudo apt-get install --yes --no-install-recommends \
            build-essential curl git pkg-config libclang-dev \
            libuhd-dev libsoapysdr-dev libboost-system-dev libsctp-dev protobuf-compiler kmod

      - name: Enable native SCTP
        run: |
          sudo=; [ "$(id -u)" -eq 0 ] || sudo=sudo
          [ -d /proc/net/sctp ] || $sudo modprobe sctp

      - name: Install Rust with rustup
        id: rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install
          rustc --verbose --version
          cargo --version
          echo "version=$(rustc --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          . /etc/os-release
          printf 'image=%s-%s\n' "${ImageOS:-$ID$VERSION_ID}" "${ImageVersion:-container}" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo dependencies and release builds
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.image }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust/crates/**/Cargo.toml', '.cargo/config.toml', 'rust-toolchain.toml', '.github/workflows/ci.yml') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run DSP tests
        run: cargo test --locked --release -p umts-dsp

      - name: Check Clippy
        run: cargo clippy --locked --workspace --all-targets --release --features umts-hnb/uhd,umts-hnb/soapy -- -D warnings

      - name: Build release targets
        run: cargo build --locked --workspace --all-targets --release --features umts-hnb/uhd,umts-hnb/soapy

      - name: Run workspace tests
        run: cargo test --locked --workspace --release --features umts-hnb/uhd,umts-hnb/soapy
