[package]
name = "umts-sctp"
description = "Re-export of the SCTP transport used by the Iuh link."
authors.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sctp-transport = { path = "../sctp-transport" }

[features]
usrsctp = ["sctp-transport/usrsctp"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
