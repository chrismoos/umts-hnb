# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "umts-hnb"
description = "A Rust UMTS Home NodeB with Rel99, HSDPA, HSUPA and Iuh core connectivity."
authors.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
uhd = ["sdr-hal/uhd-backend"]
bladerf = ["sdr-hal/bladerf-backend"]
soapy = ["sdr-hal/soapy-backend"]
usrsctp = ["umts-sctp/usrsctp"]

[dependencies]
umts-dsp = { path = "../umts-dsp" }
umts-rrc = { path = "../umts-rrc" }
umts-rrc-codec = { path = "../umts-rrc-codec" }
umts-rrc-schema = { path = "../umts-rrc-schema" }
umts-types.workspace = true
umts-radio = { path = "../umts-radio" }
umts-runtime = { path = "../umts-runtime" }
umts-core = { path = "../umts-core" }
umts-user-plane = { path = "../umts-user-plane" }
umts-iuh = { path = "../umts-iuh" }
umts-mac = { path = "../umts-mac" }
umts-rlc = { path = "../umts-rlc" }
umts-security = { path = "../umts-security" }
umts-management = { path = "../umts-management" }
prost = "=0.14.3"
sha2 = "0.10"
arc-swap = "1"
uuid = { version = "1", features = ["v4"] }
tonic = { version = "=0.14.6", default-features = false }
sdr-hal = { workspace = true, features = ["config"] }
umts-sctp = { path = "../umts-sctp" }
signal-hook = "=0.4.5"
num-complex.workspace = true
umts-config.workspace = true
anyhow.workspace = true
tracing.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
clap.workspace = true
rasn = "=0.30.0"
getrandom = "=0.4.3"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", features = ["time", "fs", "process"] }

[build-dependencies]
prost-build = "=0.14.3"

[dev-dependencies]
tempfile = "3"
sdr-hal = { workspace = true, features = ["memory"] }
serde.workspace = true

[lints]
workspace = true

[[bench]]
name = "common_runtime"
harness = false

[package.metadata.deb]
maintainer = "Chris Moos <chris@chrismoos.com>"
section = "net"
priority = "optional"
extended-description = """\
A UMTS (WCDMA/FDD) Home NodeB for software-defined radios. It connects to an \
Osmocom core network over Iuh and provides voice, SMS and packet data to \
standard 3G phones, including HSPA+ and dual-carrier HSPA. This build supports \
UHD radios such as the Ettus B200 and B210."""
depends = "$auto, uhd-host"
conf-files = ["/etc/umts-hnb/site.yaml"]
maintainer-scripts = "../../../packaging/debian/"
systemd-units = { unit-scripts = "../../../packaging/debian/", enable = false, start = false }
assets = [
    ["target/release/umts-hnb", "usr/bin/", "755"],
    ["target/release/umts-hnbctl", "usr/bin/", "755"],
    ["../../../config/defaults.yaml", "usr/share/umts-hnb/", "644"],
    ["../../../config/example.yaml", "usr/share/umts-hnb/", "644"],
    ["../../../config/example.yaml", "etc/umts-hnb/site.yaml", "644"],
    ["../../../packaging/debian/umts-hnb.sysusers", "usr/lib/sysusers.d/umts-hnb.conf", "644"],
    ["../../../packaging/debian/umts-hnb.modules-load", "usr/lib/modules-load.d/umts-hnb.conf", "644"],
    ["../../../README.md", "usr/share/doc/umts-hnb/", "644"],
    ["../../../docs/core-setup.md", "usr/share/doc/umts-hnb/", "644"],
    ["../../../docs/radios.md", "usr/share/doc/umts-hnb/", "644"],
]
